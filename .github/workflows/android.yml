name: Android validation
on:
  push:
    branches: ['codex/service-reliability']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest :test-target:assembleDebug --console=plain
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r test-target/build/outputs/apk/debug/test-target-debug.apk
            ./gradlew connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LIMIT-1.0.7-validation
          path: |
            app/build/outputs/apk/
            test-target/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/

  publish-verified-snapshot:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/service-reliability
      - uses: actions/download-artifact@v4
        with:
          name: LIMIT-1.0.7-validation
          path: validation
      - name: Preserve verified APK and reports
        run: |
          cp validation/app/build/outputs/apk/debug/app-debug.apk dist/LIMIT-1.0.7.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/LIMIT-1.0.7.apk > dist/LIMIT-1.0.7-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/LIMIT-1.0.7.apk
          zip -qr dist/LIMIT-1.0.7-test-results.zip validation/app/build/reports validation/app/build/test-results validation/app/build/outputs/androidTest-results
          sha256sum dist/LIMIT-1.0.7.apk dist/LIMIT-1.0.7-test-results.zip > dist/LIMIT-1.0.7-SHA256SUMS
          printf '%s\n' '# LIMIT 1.0.7 verification' '' 'This snapshot passed the Android validation workflow: JVM tests, lint, debug APK build and API29 emulator instrumentation including task removal.' 'Physical Redmi/HyperOS reliability, overnight battery behavior, API34+ runtime behavior and installation as an update to 1.0.6 are not certified.' 'Debug signing keys are generated per runner. Do not uninstall your personal installation to install this APK. A matching original signing key is required for an in-place update.' "Source commit: $GITHUB_SHA" "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > dist/LIMIT-1.0.7-TEST-RESULTS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/LIMIT-1.0.7*
          git commit -m 'Archive verified LIMIT 1.0.7 APK and fresh validation reports'
          git push origin HEAD:codex/service-reliability

