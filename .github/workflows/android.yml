name: Android validation
on:
  push:
    branches: ['codex/service-reliability']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest :test-target:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LIMIT-1.0.7-validation
          path: |
            app/build/outputs/apk/
            test-target/build/outputs/apk/
            app/build/reports/
            app/build/test-results/

